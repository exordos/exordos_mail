START {
  recover cmd="/usr/sbin/cyrus ctl_cyrusdb -r"
}

SERVICES {
  imaps cmd="imapd -s" listen="993" prefork=0 maxchild=50
  caldav cmd="httpd -s" listen="8443" prefork=0 maxchild=50
  lmtp cmd="lmtpd" listen="/run/exordos-mail/lmtp" prefork=1 maxchild=20
}

EVENTS {
  checkpoint cmd="/usr/sbin/cyrus ctl_cyrusdb -c" period=30
  delprune cmd="/usr/sbin/cyrus expire -E 3" at=0401
}
