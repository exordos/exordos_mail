# SPDX-License-Identifier: Apache-2.0

lua = "/usr/local/share/exordos-mail/tx.lua";
options {
  filters = "dkim";
  # The signing worker does not use the public suffix list for URL scanning.
  url_tld = "/dev/null";
  pidfile = "/run/exordos-mail-tx-filter/rspamd.pid";
  control_socket = "/run/exordos-mail-tx-filter/control.sock mode=0600";
  cache_file = "/var/cache/exordos-mail-tx-filter/symbols.cache";
  hs_cache_dir = "/var/cache/exordos-mail-tx-filter/";
}
logging {
  type = "console";
}
actions {
  reject = 100;
}
worker "rspamd_proxy" {
  bind_socket = "/run/exordos-mail-tx-filter/milter.sock mode=0660";
  count = 1;
  milter = yes;
  upstream "local" {
    default = yes;
    self_scan = yes;
  }
}
