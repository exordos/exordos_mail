dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
protocols =
instance_name = exordos-mail-tx-auth
base_dir = /run/exordos-mail-tx-auth
state_dir = /run/exordos-mail-tx-auth
log_path = /dev/stderr
auth_mechanisms = plain login
auth_username_format = %{user | lower}
auth_username_chars =

service auth {
  unix_listener auth-client {
    mode = 0660
    user = exordos-mail-tx
    group = exordos-mail-tx
  }
}

passdb passwd-file {
  passwd_file_path = /persist/mail/control/tx.passwd
  default_password_scheme = CRYPT
}
