# SPDX-License-Identifier: Apache-2.0

configdirectory: /persist/mail/cyrus/config
partition-default: /persist/mail/cyrus/spool
sievedir: /persist/mail/cyrus/sieve
servername: mail.@DOMAIN@
defaultdomain: @DOMAIN@
virtdomains: userid
unixhierarchysep: yes
admins: exordos-provisioner
autocreate_quota: 0
autocreate_post: yes
allowplaintext: yes
sasl_mech_list: PLAIN LOGIN
sasl_pwcheck_method: saslauthd
sasl_saslauthd_path: /run/exordos-mail/saslauthd/mux
lmtpsocket: /run/exordos-mail/lmtp
httpmodules: caldav
calendarprefix: Calendars
caldav_realm: @DOMAIN@
tls_server_cert: /persist/mail/tls/rx.crt
tls_server_key: /persist/mail/tls/rx.key
tls_client_ca_file: /persist/mail/tls/trust.crt
smtp_backend: host
smtp_host: localhost:1587
smtp_auth_authname: calendar-scheduler
smtp_auth_password: @CALENDAR_SECRET@
