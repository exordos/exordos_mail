[project]
name = "exordos_mail"
description = "SMTP relay PaaS plugin for the Exordos MetaPaaS runtime (exim4)"
readme = "README.md"
authors = [{name = "Genesis Corporation", email = "mail@gmelikov.ru"}]
dynamic = ["version"]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "oslo.config>=3.22.2,<10.0.0",
    "restalchemy>=15.0.0,<16.0.0",
    "gcl_iam>=1.0.3,<2.0.0",
    "gcl_looper>=1.2.3,<2.0.0",
    "gcl_sdk>=3.0.0,<4.0.0",
    "exordos_metapaas>=0.0.5",
]

[project.entry-points."exordos_metapaas_paas"]
mail = "exordos_mail.definition:MailDefinition"

[project.entry-points."gcl_sdk_universal_agent"]
MailCapabilityDriver = "exordos_mail.dataplane.driver:MailCapabilityDriver"

[build-system]
requires = ["setuptools>=75.3.3", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project.urls]
homepage = "https://github.com/infraguys/metapaas_mail/"

[project.optional-dependencies]
dev = [
    "tox>=4.0.0",
    "tox-uv",
    "pytest>=7.0.0",
]
test = [
    "coverage>=4.0",
    "mock>=3.0.5,<4.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-timer>=1.0.0,<2.0.0",
    "exordos>=2.0.0,<3.0.0",
]
ruff = [
    "ruff",
]
mypy = [
    "mypy",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"
exclude = [".venv", "build", "dist", "output", "__pycache__"]

[lint]
select = ["E4", "E7", "E9", "F"]
fixable = ["ALL"]

[tool.coverage.run]
branch = true
source = ["exordos_mail"]
command_line = "-m pytest -s exordos_mail/tests/unit"
omit = ["exordos_mail/tests/*", ".venv"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true

[tool.coverage.html]
directory = "cover"

[tool.coverage.xml]
output = "cover/coverage.xml"

[tool.mypy]
files = ["exordos_mail"]
python_version = "3.12"
disallow_untyped_defs = true
show_error_codes = true
no_implicit_optional = true
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["exordos_mail*"]

[tool.setuptools.package-data]
exordos_mail = ["migrations/*.py"]
