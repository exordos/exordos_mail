name: build

on:
  push:
  pull_request:
    types: [opened]

jobs:
  # The self-hosted runners come with packer, KVM and the exordos CLI already
  # set up, so the build is just checkout + build + push.
  Build:
    runs-on: [self-hosted, vm]
    if: ${{ github.actor != 'dependabot[bot]' }}
    outputs:
      version: ${{ steps.build_element.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build Element
        id: build_element
        env:
          PUSH_EXORDOS_CFG: ${{ secrets.PUSH_EXORDOS_CFG }}
        run: |
          set -eux

          VERSION="$(exordos get-version .)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          exordos build $(pwd)

          # Decode and write the push configuration
          echo "$PUSH_EXORDOS_CFG" | base64 -d > exordos/exordos.push.yaml
          exordos push -c exordos/exordos.push.yaml -t exordos_repo -f --latest

  # End-to-end run on a realm, through exordos_ci's shared workflow: the
  # element built from this commit installed on it, then the functional suite
  # run on the realm itself, where the mail data plane is reachable.
  E2E:
    needs: Build
    uses: exordos/exordos_ci/.github/workflows/element_realm_test.yml@master
    with:
      elements: mailaas
      version: ${{ needs.Build.outputs.version }}
      # No element gets more than ten minutes to come up.
      element-timeout: 600
      ssh: true
      overbook: true
      dependencies: metapaas
      check-script: .github/scripts/run-functional-in-realm.sh
    secrets: inherit
