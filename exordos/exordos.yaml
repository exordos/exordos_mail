build:
  deps:
    - dst: /opt/exordos_metapaas
      path:
        src: ../../exordos_mail
      exclude:
        - .venv
        - .tox
        - output

  elements:
    # mail dataplane image (launched per mail instance by the infra builder)
    - manifest: manifests/mailaas.yaml.j2
      artifacts:
        - path: artifacts/icon.jpg
        - path: artifacts/preview-1.jpg
        - path: artifacts/preview-2.jpg
        # The wheel the metapaas PluginReconciler installs on metapaas-cp.
        # Shipping it as an element artifact means the manifest can point at
        # this exact build (urn:artifacts:<uuid>) instead of resolving a
        # version off a pip index.
        - script: images/build_wheel.sh
          name: pypi_package
          artifacts:
            - ../dist/*.whl
      images:
      - name: exordos-metapaas-mail-dp
        format: GEN_IMG_FORMAT_CORE=zst
        profile: exordos_base
        script: images/dp_install.sh
        override:
          disk_size: "6G"
          use_backing_file: true
