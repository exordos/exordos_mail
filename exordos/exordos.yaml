build:
  deps:
    - dst: /opt/exordos_metapaas
      path:
        src: ../../metapaas_mail
      exclude:
        - .venv
        - .tox
        - output

    - dst: /opt/gcl_sdk
      optional: true
      path:
        env: LOCAL_GENESIS_SDK_PATH

  elements:
    # mail-aas install manifest: registers the mail PaaS type in metapaas,
    # IAM permissions and the mail-aas-namespaced dataplane version.
    - manifest: manifests/mail-aas.yaml.j2

    # Example consumer element: declaratively creates a mail instance.
    - manifest: manifests/example_mail.yaml.j2

    # mail dataplane image (launched per mail instance by the infra builder)
    - manifest: manifests/mail-aas.yaml.j2
      images:
      - name: exordos-metapaas-mail-dp
        format: GEN_IMG_FORMAT_CORE=zst
        profile: exordos_base
        script: images/dp_install.sh
        override:
          disk_size: "6G"
          use_backing_file: true
